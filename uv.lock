version = 1
revision = 5
requires-python = ">=3.12"

[manifest]
members = [
    "my-monorepo",
    "nuc",
    "packages",
]

[[package]]
name = "my-monorepo"
version = "0.0.0"
source = { virtual = "." }

[[package]]
name = "nuc"
version = "0.1.0"
source = { virtual = "nuc" }
dependencies = [
    { name = "packages" },
]

[package.metadata]
requires-dist = [{ name = "packages", editable = "packages" }]

[[package]]
name = "packages"
version = "0.0.0"
source = { editable = "packages" }
